# The demo gateway, worker and its storage (MinIO). Start the LGTM stack in
# ../deploy first: these join its network and send telemetry to its Alloy.
#
# Build the images with ./build-versions.sh (v1 and v2, see README).
#
#   Gateway  http://localhost:8080/v1/{op}/{database}
#   MinIO    http://localhost:9001 (console, minioadmin / minioadmin)

name: infino-demo

services:
  minio:
    # MinIO no longer publishes free images; this is the last Bitnami build.
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_DEFAULT_BUCKETS: infino
    volumes:
      - minio-data:/bitnami/minio/data
    ports:
      - "127.0.0.1:9001:9001"
    healthcheck:
      # Healthy once the bucket exists; it is created a moment after MinIO starts.
      test: ["CMD", "mc", "ls", "local/infino"]
      interval: 2s
      retries: 30
    restart: unless-stopped

  infino-worker:
    # Demo 3: WORKER_VERSION=v2 deploys the engine with the fix (#1033).
    image: infino-demo:${WORKER_VERSION:-v1}
    command: ["infino-worker"]
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      INSTANCE_ID: worker-1
      # One optimize makes thousands of spans; the default queue (2048) drops some.
      OTEL_BSP_MAX_QUEUE_SIZE: "65536"
      STORAGE_URI: s3://infino
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
    depends_on:
      minio:
        condition: service_healthy
    restart: unless-stopped

  infino-gateway:
    image: infino-demo:v1
    command: ["infino-gateway"]
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      INSTANCE_ID: gateway-1
      WORKER_URL: http://infino-worker:9000
      SLOW_QUERY_MS: "1000"
      # optimize gets 60s instead.
      REQUEST_TIMEOUT_MS: "2000"
      # Demo 1: random stalls in parse_request. Set to 0 to turn off.
      STALL_PERCENT: "0"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - infino-worker
    restart: unless-stopped

volumes:
  minio-data:

networks:
  default:
    name: lgtm_default
    external: true
